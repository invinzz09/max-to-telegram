[main]
; токен бота от @BotFather
bot_token=ВСТАВЬ_ТОКЕН_БОТА
; chat_id получателя в Telegram (узнаётся, когда напишешь боту; можно через @userinfobot)
chat_id = ВСТАВЬ_CHAT_ID
; локальный SOCKS5-прокси ТОЛЬКО к Telegram (xray на хост-ПК, НЕ Happ/VPN).
; формат: socks5h://USER:PASS@HOST:PORT  (HOST = адрес хост-ПК в LAN, напр. 192.168.1.10)
proxy = socks5h://USER:PASS@HOST:PORT
; ежедневный отчёт «работает» (ЧЧ:ММ по локальному времени ВМ)
daily_report = 12:30
poll_seconds = 5
; CDP-режим: on = читать кадры веб-сокета MAX и слать вложения целиком (рабочий режим).
; off = запасной (только текст уведомлений Windows).
cdp_enabled = on
; cdp_login: on ТОЛЬКО для разового входа в MAX по QR (окно разворачивается). В работе = off.
cdp_login = off
; ответы из Telegram в MAX: «Ответить» на пересланном или «@Имя» первой строкой.
; Только текст, только личные чаты (DIALOG), адресат сверяется по номеру чата MAX. off = выключено.
replies = on
; расшифровка голосовых локально (whisper.cpp + ffmpeg в C:\whisper). off = только голосовое.
transcribe = on
whisper_model = ggml-large-v3-turbo-q5_0.bin
